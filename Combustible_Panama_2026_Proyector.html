<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combustible Panamá 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#10243e;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}header{background:#173f6d;color:#fff;border-radius:16px;padding:24px 28px}h1{margin:0;font-size:32px}.sub{margin-top:7px;opacity:.85}.card{background:#fff;border:1px solid #dbe4ef;border-radius:15px;margin-top:16px;padding:18px;box-shadow:0 4px 16px #173f6d18}.nav{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.month{font-size:25px;font-weight:800;min-width:190px;text-align:center}button{padding:10px 16px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#173f6d;font-weight:bold;cursor:pointer}input{width:min(650px,100%);accent-color:#173f6d}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{margin-top:16px}.label{font-weight:bold}.value{font-size:29px;font-weight:900;margin:10px 0}.blue{color:#2563eb}.red{color:#dc2626}.green{color:#65a30d}.chart{height:390px}.legend{text-align:center;font-weight:bold;margin-top:8px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 5px 0 16px}.info{line-height:1.5;background:#eef4fa}.foot{text-align:center;color:#64748b;font-size:12px;margin-top:12px}@media(max-width:700px){.metrics{grid-template-columns:1fr}h1{font-size:23px}.chart{height:320px}}
</style></head><body><div class="wrap"><header><h1>EVOLUCIÓN DEL PRECIO DEL COMBUSTIBLE EN PANAMÁ — 2026</h1><div class="sub">Gasolina 95 • Gasolina 91 • Diésel ULS | B/. por litro | Enero–Septiembre 2026</div></header><div class="card"><div class="nav"><button onclick="move(-1)">‹ Anterior</button><div class="month" id="m"></div><button onclick="move(1)">Siguiente ›</button></div><div style="text-align:center;margin-top:15px"><input id="s" type="range" min="0" max="8" value="0" oninput="sel(+this.value)"></div></div><div class="metrics"><div class="card metric"><div class="label blue">⛽ Gasolina 95</div><div class="value" id="a"></div><div id="ac"></div></div><div class="card metric"><div class="label red">⛽ Gasolina 91</div><div class="value" id="b"></div><div id="bc"></div></div><div class="card metric"><div class="label green">⛽ Diésel ULS</div><div class="value" id="c"></div><div id="cc"></div></div></div><div class="card"><canvas id="g" class="chart"></canvas><div class="legend"><span class="dot" style="background:#2563eb"></span>Gasolina 95 <span class="dot" style="background:#dc2626"></span>Gasolina 91 <span class="dot" style="background:#65a30d"></span>Diésel ULS</div></div><div class="card info" id="info"></div><div class="foot">Fuente de referencia: Secretaría Nacional de Energía (SNE). Valores en B/. por litro.</div></div><script>
const D=[['Enero 2026',.840,.782,.763],['Febrero 2026',.906,.851,.832],['Marzo 2026',1.144,1.065,1.210],['Abril 2026',1.231,1.173,1.368],['Mayo 2026',1.337,1.252,1.279],['Junio 2026',1.178,1.110,1.104],['Julio 2026',1.170,1.110,1.090],['Agosto 2026',1.226,1.160,1.353],['Septiembre 2026',1.384,1.287,1.530]];let i=0;
function pct(x){return ((x/D[0][arguments[1]||1]-1)*100).toFixed(1)}function sel(n){i=n;document.getElementById('s').value=i;let d=D[i];document.getElementById('m').textContent=d[0];['a','b','c'].forEach((id,j)=>document.getElementById(id).textContent='B/.'+d[j+1].toFixed(3));['ac','bc','cc'].forEach((id,j)=>{let p=(d[j+1]/D[0][j+1]-1)*100;let e=document.getElementById(id);e.textContent=(p>=0?'▲ +':'▼ ')+Math.abs(p).toFixed(1)+'% vs. enero';e.style.color=p>=0?'#dc2626':'#16a34a';e.style.fontWeight='bold'});document.getElementById('info').innerHTML='<b>En '+d[0]+':</b> gasolina 95: <b>B/.'+d[1].toFixed(3)+'/L</b>; gasolina 91: <b>B/.'+d[2].toFixed(3)+'/L</b>; diésel ULS: <b>B/.'+d[3].toFixed(3)+'/L</b>.';draw()}
function move(n){sel((i+n+9)%9)}function draw(){let c=document.getElementById('g'),r=c.getBoundingClientRect(),q=devicePixelRatio||1;c.width=r.width*q;c.height=r.height*q;let x=c.getContext('2d');x.scale(q,q);let W=r.width,H=r.height,p={l:55,r:20,t:20,b:45},cw=W-p.l-p.r,ch=H-p.t-p.b;x.clearRect(0,0,W,H);x.font='12px Arial';x.fillStyle='#64748b';x.strokeStyle='#dbe4ef';for(let y=0;y<=1.6;y+=.2){let py=p.t+ch-y/1.6*ch;x.beginPath();x.moveTo(p.l,py);x.lineTo(W-p.r,py);x.stroke();x.fillText(y.toFixed(1),10,py+4)}let col=['#2563eb','#dc2626','#65a30d'];for(let s=0;s<3;s++){x.strokeStyle=col[s];x.lineWidth=3;x.beginPath();D.forEach((d,k)=>{let xx=p.l+k*cw/8,yy=p.t+ch-d[s+1]/1.6*ch;k?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();D.forEach((d,k)=>{let xx=p.l+k*cw/8,yy=p.t+ch-d[s+1]/1.6*ch;x.fillStyle=col[s];x.beginPath();x.arc(xx,yy,4,0,7);x.fill()})}let xx=p.l+i*cw/8;x.strokeStyle='#0f172e66';x.setLineDash([5,5]);x.beginPath();x.moveTo(xx,p.t);x.lineTo(xx,p.t+ch);x.stroke();x.setLineDash([]);x.fillStyle='#475569';x.textAlign='center';D.forEach((d,k)=>x.fillText(d[0].split(' ')[0].slice(0,3),p.l+k*cw/8,H-18))}
sel(0);addEventListener('resize',draw);
</script></body></html>
